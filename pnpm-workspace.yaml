packages:
  - apps/*
  - packages/*
  - tests/e2e

# Dependencies allowed to run install scripts; every other build script stays blocked.
allowBuilds:
  '@swc/core': true
  argon2: true

# Security fixes in transitive dependencies, until the direct dependency declares them (ADR-002).
overrides:
  # GHSA-q7qp-rjg7-q26m, via @nestjs/platform-express 12.2.0.
  multer: 2.5.0
