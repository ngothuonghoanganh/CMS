packages:
  - apps/*
  - packages/*
  - tests/e2e

# Dependencies allowed to run install scripts; every other build script stays blocked.
allowBuilds:
  '@swc/core': true
  argon2: true

# Security fixes in transitive dependencies, until the direct dependency declares them (ADR-002).
overrides:
  # GHSA-q7qp-rjg7-q26m, via @nestjs/platform-express 12.2.0.
  multer: 2.5.0
  # GHSA-g3hv-75wg-m249 (fixed only in 11.x), via eslint, typescript-eslint and @nestjs/cli; dev
  # tools only, whose patterns come from this repository. They use only `minimatch()` and
  # `new Minimatch().match()`, which 11 keeps.
  minimatch: 11.0.3
