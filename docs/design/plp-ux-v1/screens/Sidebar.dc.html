<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sidebar điều hướng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Điều hướng chính" style="box-sizing: border-box; width: 100%; padding: 16px 12px 20px; display: flex; flex-direction: column; gap: 20px; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #15171C; background: #FFFFFF">
  <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 0">
    <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; background: #4338CA; display: flex; align-items: center; justify-content: center">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
    </span>
    <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em">Payload</span>
  </div>

  <button type="button" aria-label="Đổi workspace — hiện tại: Mây Xanh Agency" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 1px solid #E2E5EA; border-radius: 10px; background: #FFFFFF; cursor: pointer; text-align: left; font: inherit; color: inherit">
    <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 8px; background: #15171C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px">MX</span>
    <span style="display: flex; flex-direction: column; min-width: 0; flex: 1">
      <span style="font-size: 11px; color: #5E6573; font-weight: 500">Workspace</span>
      <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Mây Xanh Agency</span>
    </span>
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6573" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
  </button>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 11px; font-weight: 600; color: #5E6573; letter-spacing: 0.06em; padding: 0 8px">SITE KHÁCH HÀNG</span>
    <button type="button" aria-label="Đổi site — hiện tại: Nha khoa Smile Care" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 0; border-radius: 10px; background: #F0F2F5; cursor: pointer; text-align: left; font: inherit; color: inherit">
      <span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 7px; background: #D9F2EE; color: #0F5E55; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">S</span>
      <span style="display: flex; flex-direction: column; min-width: 0; flex: 1">
        <span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Nha khoa Smile Care</span>
        <span style="font-size: 11px; color: #5E6573; font-family: 'JetBrains Mono', ui-monospace, monospace">go.smilecare.vn</span>
      </span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6573" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <a href="Main.dc.html" aria-current="{{ nav.pages.cur }}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; background: {{ nav.pages.bg }}; color: {{ nav.pages.fg }}; font-weight: {{ nav.pages.fw }}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path><path d="M14 3v5h5"></path></svg>
      <span style="flex: 1">Trang</span>
      <span style="font-size: 12px; color: #5E6573">6</span>
    </a>
    <a href="Leads.dc.html" aria-current="{{ nav.leads.cur }}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; background: {{ nav.leads.bg }}; color: {{ nav.leads.fg }}; font-weight: {{ nav.leads.fw }}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2.5-7h11L20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"></path><path d="M4 13h4l1.5 2.5h5L16 13h4"></path></svg>
      <span style="flex: 1">Leads</span>
      <span style="font-size: 11px; font-weight: 600; color: #FFFFFF; background: #4338CA; border-radius: 999px; padding: 2px 7px">12 mới</span>
    </a>
    <a href="Analytics.dc.html" aria-current="{{ nav.analytics.cur }}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; background: {{ nav.analytics.bg }}; color: {{ nav.analytics.fg }}; font-weight: {{ nav.analytics.fw }}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"></path></svg>
      <span style="flex: 1">Hiệu quả</span>
    </a>
    <a href="Domain.dc.html" aria-current="{{ nav.domain.cur }}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; background: {{ nav.domain.bg }}; color: {{ nav.domain.fg }}; font-weight: {{ nav.domain.fw }}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>
      <span style="flex: 1">Tên miền</span>
    </a>
    <a href="Consent.dc.html" aria-current="{{ nav.consent.cur }}" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; background: {{ nav.consent.bg }}; color: {{ nav.consent.fg }}; font-weight: {{ nav.consent.fw }}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg>
      <span style="flex: 1">Dữ liệu &amp; đồng ý</span>
    </a>
    <button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; text-align: left; font: inherit; font-size: 14px; font-weight: 500; color: #3C424E">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
      <span style="flex: 1">Cài đặt site</span>
    </button>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid #E2E5EA">
    <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 999px; background: #EEF0FF; color: #3730A3; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px">NA</span>
    <span style="display: flex; flex-direction: column; min-width: 0; flex: 1">
      <span style="font-size: 13px; font-weight: 600">Ngọc Anh</span>
      <span style="font-size: 12px; color: #5E6573">Owner</span>
    </span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["pages","leads","analytics","domain","consent","none"],"default":"pages"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'pages';
    var keys = ['pages', 'leads', 'analytics', 'domain', 'consent'];
    var nav = {};
    keys.forEach(function (k) {
      var on = k === active;
      nav[k] = {
        cur: on ? 'page' : null,
        bg: on ? '#EEF0FF' : 'transparent',
        fg: on ? '#3730A3' : '#3C424E',
        fw: on ? 600 : 500
      };
    });
    return { nav: nav };
  }
}
</script>
</body>
</html>
