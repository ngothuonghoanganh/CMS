<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sidebar điều hướng v2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
:focus-visible{outline:2px solid #4338CA;outline-offset:2px}
</style>
</helmet>
<nav aria-label="Điều hướng chính" style="box-sizing: border-box; width: 100%; min-height: 1000px; padding: 16px 12px 20px; display: flex; flex-direction: column; gap: 16px; font-family: 'Be Vietnam Pro', system-ui, sans-serif; color: #15171C; background: #FFFFFF">
  <div style="display: flex; align-items: center; gap: 8px; padding: 4px 8px 0">
    <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 6px; background: #4338CA; display: flex; align-items: center; justify-content: center">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
    </span>
    <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em">Payload</span>
  </div>

  <button type="button" aria-label="Đổi workspace — hiện tại: Mây Xanh Agency" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 1px solid #E2E5EA; border-radius: 10px; background: #FFFFFF; cursor: pointer; text-align: left; font: inherit; color: inherit">
    <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 8px; background: #15171C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px">MX</span>
    <span style="display: flex; flex-direction: column; min-width: 0; flex: 1">
      <span style="font-size: 11px; color: #5E6573; font-weight: 500">Workspace · {{ planLabel }}</span>
      <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Mây Xanh Agency</span>
    </span>
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6573" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
  </button>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 11px; font-weight: 600; color: #5E6573; letter-spacing: 0.06em; padding: 0 8px 4px">WORKSPACE</span>
    <sc-for list="{{ wsItems }}" as="it" hint-placeholder-count="6">
      <a href="{{ it.href }}" aria-current="{{ it.cur }}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; background: {{ it.bg }}; color: {{ it.fg }}; font-weight: {{ it.fw }}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.d }}"></path></svg>
        <span style="flex: 1">{{ it.label }}</span>
        <sc-if value="{{ it.locked }}" hint-placeholder-val="{{ false }}">
          <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #474E5C; background: #ECEEF2; border-radius: 999px; padding: 2px 7px">
            <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg>
            Nâng cấp
          </span>
        </sc-if>
        <sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 12px; color: #5E6573">{{ it.badge }}</span>
        </sc-if>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 11px; font-weight: 600; color: #5E6573; letter-spacing: 0.06em; padding: 0 8px">SITE KHÁCH HÀNG</span>
    <button type="button" aria-label="Đổi site — hiện tại: Nha khoa Smile Care" style="display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border: 0; border-radius: 10px; background: #F0F2F5; cursor: pointer; text-align: left; font: inherit; color: inherit">
      <span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 7px; background: #D9F2EE; color: #0F5E55; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">S</span>
      <span style="display: flex; flex-direction: column; min-width: 0; flex: 1">
        <span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Nha khoa Smile Care</span>
        <span style="font-size: 11px; color: #5E6573; font-family: 'JetBrains Mono', ui-monospace, monospace">go.smilecare.vn</span>
      </span>
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6573" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{ siteItems }}" as="it" hint-placeholder-count="8">
      <a href="{{ it.href }}" aria-current="{{ it.cur }}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; text-decoration: none; font-size: 14px; background: {{ it.bg }}; color: {{ it.fg }}; font-weight: {{ it.fw }}">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.d }}"></path></svg>
        <span style="flex: 1">{{ it.label }}</span>
        <sc-if value="{{ it.locked }}" hint-placeholder-val="{{ false }}">
          <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #474E5C; background: #ECEEF2; border-radius: 999px; padding: 2px 7px">
            <svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg>
            Nâng cấp
          </span>
        </sc-if>
        <sc-if value="{{ it.hasNew }}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 11px; font-weight: 600; color: #FFFFFF; background: #4338CA; border-radius: 999px; padding: 2px 7px">{{ it.badge }}</span>
        </sc-if>
      </a>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 0; border-top: 1px solid #E2E5EA">
    <span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 999px; background: #EEF0FF; color: #3730A3; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px">{{ initials }}</span>
    <span style="display: flex; flex-direction: column; min-width: 0; flex: 1">
      <span style="font-size: 13px; font-weight: 600">{{ userName }}</span>
      <span style="font-size: 12px; color: #5E6573">{{ roleLabel }}</span>
    </span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["sites","templates","marketplace","members","roles","billing","pages","leads","crm","analytics","automation","domain","settings","consent","none"],"default":"none"},"role":{"editor":"enum","options":["owner","editor","sales"],"default":"owner"},"planLimited":{"editor":"boolean","default":false},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'none';
    var role = this.props.role ?? 'owner';
    var limited = this.props.planLimited ?? false;
    var I = {
      sites: 'M4 5h16v14H4zM4 9h16',
      templates: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
      marketplace: 'M4 9l1.5-5h13L20 9M5 9v11h14V9M4 9h16M10 20v-5h4v5',
      members: 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 6.5M21 20c0-2.6-1.6-4.9-4-5.7',
      roles: 'M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5zM12 15v2',
      billing: 'M3 6h18v12H3zM3 10h18M7 15h3',
      pages: 'M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5',
      leads: 'M4 13l2.5-7h11L20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1zM4 13h4l1.5 2.5h5L16 13h4',
      crm: 'M5 4h14v16H5zM12 11a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5zM8 17c.6-2.3 2.1-3.5 4-3.5s3.4 1.2 4 3.5',
      analytics: 'M4 20h16M7 16v-5M12 16V6M17 16v-8',
      automation: 'M13 3L5 13h6l-1 8 8-10h-6z',
      domain: 'M3 12a9 9 0 1 0 18 0 9 9 0 0 0-18 0zM3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z',
      settings: 'M4 7h10M18 7h2M4 17h4M12 17h8M14 7a2 2 0 1 0 4 0 2 2 0 0 0-4 0zM8 17a2 2 0 1 0 4 0 2 2 0 0 0-4 0z',
      consent: 'M12 3l7 3v6c0 4.5-3 7.8-7 9-4-1.2-7-4.5-7-9V6zM9 12l2 2 4-4'
    };
    var visible = {
      owner: null,
      editor: ['sites', 'templates', 'marketplace', 'members', 'pages', 'analytics', 'settings'],
      sales: ['sites', 'members', 'pages', 'leads', 'crm', 'analytics', 'automation']
    }[role];
    function mk(key, label, href, extra) {
      var on = key === active;
      var it = {
        key: key, label: label, href: href, d: I[key],
        cur: on ? 'page' : null,
        bg: on ? '#EEF0FF' : 'transparent',
        fg: on ? '#3730A3' : '#3C424E',
        fw: on ? 600 : 500,
        locked: false, hasBadge: false, hasNew: false, badge: ''
      };
      if (extra) { for (var k in extra) { it[k] = extra[k]; } }
      return it;
    }
    function keep(it) { return !visible || visible.indexOf(it.key) >= 0; }
    var ws = [
      mk('sites', 'Sites', 'Main.dc.html', { hasBadge: true, badge: '4' }),
      mk('templates', 'Templates', 'TemplateLibrary.dc.html'),
      mk('marketplace', 'Marketplace', 'Marketplace.dc.html', { locked: limited }),
      mk('members', 'Thành viên', 'Members.dc.html', { hasBadge: true, badge: '7' }),
      mk('roles', 'Vai trò & quyền', 'Roles.dc.html'),
      mk('billing', 'Gói & thanh toán', 'Plan.dc.html')
    ].filter(keep);
    var site = [
      mk('pages', 'Trang', 'Main.dc.html'),
      mk('leads', 'Leads', 'Leads.dc.html', { hasNew: true, badge: '12 mới' }),
      mk('crm', 'Khách hàng', 'Contacts.dc.html'),
      mk('analytics', 'Hiệu quả', 'Analytics.dc.html'),
      mk('automation', 'Automation', 'Automations.dc.html', { locked: limited }),
      mk('domain', 'Tên miền', 'Domains.dc.html'),
      mk('settings', 'Cài đặt site', 'Main.dc.html'),
      mk('consent', 'Dữ liệu & đồng ý', 'Consent.dc.html')
    ].filter(keep);
    var people = {
      owner: { n: 'Ngọc Anh', i: 'NA', r: 'Chủ sở hữu' },
      editor: { n: 'Minh Khoa', i: 'MK', r: 'Biên tập · 2 site' },
      sales: { n: 'Thu Hà', i: 'TH', r: 'Chăm sóc khách hàng · 1 site' }
    }[role];
    return {
      wsItems: ws, siteItems: site,
      userName: people.n, initials: people.i, roleLabel: people.r,
      planLabel: limited ? 'Gói Cơ bản' : 'Gói Agency'
    };
  }
}
</script>
</body>
</html>
