services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      # Keep the host port isolated from other local MongoDB projects.
      - '27018:27017'
    environment:
      MONGO_INITDB_DATABASE: payload_landing_platform
    volumes:
      - payload_mongodb_data:/data/db
    healthcheck:
      test:
        ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep 1']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  payload_mongodb_data:
